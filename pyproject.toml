[project]
name = "pincode-garden"
version = "0.1.0"
description = "Pincode Garden — Gemma 4 + TabPFN sowing plans grounded in frost dates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Optional: `ollama run gemma4:e2b` (or set GEMMA_MODEL) to use the real
# Gemma 4 brain in src/sow.py. The app boots and serves
# deterministic stub plans without it.

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tabpfn = ["tabpfn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
